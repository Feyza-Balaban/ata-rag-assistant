services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ata_rag
      POSTGRES_USER: ata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ata -d ata_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    expose:
      - "5432"

  indexer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.index_vectors", "--rebuild"]
    environment:
      ATA_CHUNKS_PATH: /app/scraper/output/chunks.jsonl
      ATA_VECTOR_DATABASE_URL: postgresql://ata:${POSTGRES_PASSWORD}@postgres:5432/ata_rag
      ATA_EMBEDDING_PROVIDER: ${ATA_EMBEDDING_PROVIDER:-local}
      ATA_EMBEDDING_MODEL: ${ATA_EMBEDDING_MODEL:-/opt/models/paraphrase-multilingual-MiniLM-L12-v2}
      ATA_EMBEDDING_DIMENSIONS: ${ATA_EMBEDDING_DIMENSIONS:-384}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ATA_CHUNKS_PATH: /app/scraper/output/chunks.jsonl
      ATA_BACKEND_API_KEY: ${ATA_BACKEND_API_KEY:?ATA_BACKEND_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ATA_VECTOR_DATABASE_URL: postgresql://ata:${POSTGRES_PASSWORD}@postgres:5432/ata_rag
      ATA_EMBEDDING_PROVIDER: ${ATA_EMBEDDING_PROVIDER:-local}
      ATA_EMBEDDING_MODEL: ${ATA_EMBEDDING_MODEL:-/opt/models/paraphrase-multilingual-MiniLM-L12-v2}
      ATA_EMBEDDING_DIMENSIONS: ${ATA_EMBEDDING_DIMENSIONS:-384}
      ATA_VECTOR_SIMILARITY_THRESHOLD: ${ATA_VECTOR_SIMILARITY_THRESHOLD:-0.55}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ATA_RAG_API_URL: http://backend:8000/ask
      ATA_RAG_METRICS_URL: http://backend:8000/metrics
      ATA_RAG_API_KEY: ${ATA_BACKEND_API_KEY:?ATA_BACKEND_API_KEY is required}
    depends_on:
      - backend
    expose:
      - "8501"

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8502"]
    environment:
      ATA_RAG_API_URL: http://backend:8000/ask
      ATA_RAG_METRICS_URL: http://backend:8000/metrics
      ATA_RAG_API_KEY: ${ATA_BACKEND_API_KEY:?ATA_BACKEND_API_KEY is required}
    depends_on:
      - backend
    expose:
      - "8502"

volumes:
  pgvector_data: